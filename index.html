<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بانگێشتنامەی شۆڕش و دییە</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="envelope-screen" class="screen active" onclick="openEnvelope()">
        <div class="envelope-image">
            <div class="open-text">بکەرەوە</div>
        </div>
    </div>

    <div id="invitation-screen" class="screen">
        <div class="container">
            
            <img src="https://i.gifer.com/origin/72/72c672b1236fb647575239a51d5ba59b_w200.gif" class="butterfly" alt="پەپوولە">
            
            <p class="intro-text">بەوپەڕی خۆشحاڵییەوە بانگهێشتتان دەکەین بۆ ئامادەبوون لە ئاهەنگی مارەبڕینی</p>
            
            <h1 class="names">شۆڕش <span class="and">و</span> دییە</h1>

            <div class="pink-card">
                <div class="pill">دووشەممە</div>
                <div class="details">
                    <p class="date-text">١٠ / ٨ / ٢٠٢٦</p>
                    <hr class="divider">
                    <p class="time-text">کاتژمێر ٨:٠٠ ی شەو</p>
                </div>
            </div>

            <div class="pink-card">
                <div class="pill">شوێن</div>
                <div class="details">
                    <p class="location-text">هۆڵی مۆنالیسا</p>
                    <iframe src="https://maps.google.com/maps?q=Monalisa%20Hall%20Sulaymaniyah&t=&z=15&ie=UTF8&iwloc=&output=embed" width="100%" height="150" style="border:0; border-radius: 10px; margin-top: 10px;" allowfullscreen="" loading="lazy"></iframe>
                </div>
            </div>

            <p class="notes">بە هاتنتان ئاهەنگەکەمان ڕازاوەتر دەبێت.</p>
            
            <button class="contact-btn">
                <span>پەیوەندی</span>
                <span class="icon">📞</span>
            </button>
            
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
