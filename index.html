<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بانگێشتنامەی شۆڕش و دییە</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="envelope-screen" class="screen active">
        <div class="envelope" onclick="openEnvelope()">
            <div class="flap"></div>
            <div class="seal"></div>
            <div class="pocket"></div>
            <div class="text-hint">کرتە بکە بۆ کردنەوەی بانگێشتنامەکە</div>
        </div>
    </div>

    <div id="invitation-screen" class="screen">
        <div class="container">
            <img src="https://cdn-icons-png.flaticon.com/512/2927/2927341.png" alt="پەپوولە" width="80" style="margin-bottom: 15px;">
            
            <p class="intro-text">بەوپەڕی خۆشحاڵییەوە بانگهێشتتان دەکەین بۆ ئامادەبوون لە ئاهەنگی مارەبڕینی</p>
            
            <h1 class="names">شۆڕش <span>و</span> دییە</h1>

            <div class="card">
                <h2>دووشەممە</h2>
                <p class="date">١٠ / ٨ / ٢٠٢٦</p>
                <p class="time">کاتژمێر ٨:٠٠ ی شەو</p>
            </div>

            <div class="card">
                <h2>شوێن</h2>
                <p>هۆڵی مۆنالیسا</p>
                <iframe src="https://www.google.com/maps?q=Monalisa+Hall+Sulaymaniyah&output=embed" width="100%" height="200" style="border:0; border-radius: 10px;" allowfullscreen="" loading="lazy"></iframe>
            </div>

            <div class="card">
                <p class="notes">بە هاتنتان ئاهەنگەکەمان ڕازاوەتر دەبێت.</p>
            </div>
            
            <button class="contact-btn">پەیوەندی کردن</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
